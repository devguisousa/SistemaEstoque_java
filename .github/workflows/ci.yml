name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estoque
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U teste -d estoque"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify

        env:
          DB_USUARIO: teste
          DB_SENHA: teste
          JWT_SECRET: chave-so-de-teste-com-mais-de-32-caracteres